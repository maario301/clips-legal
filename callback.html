<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Auth Callback — N8N Mario Clips</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;max-width:720px;margin:0 auto;padding:60px 20px;line-height:1.6;color:#1f2933;background:#0f1115}
  .card{background:#fff;border-radius:16px;padding:40px}
  h1{font-size:1.6em;margin-top:0}
  .accent{color:#ec407a}
  code,#code{display:block;background:#f0f2f5;padding:14px;border-radius:8px;word-break:break-all;font-size:1.05em;margin:10px 0}
  button{background:#ec407a;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:1em;cursor:pointer}
  .err{color:#c62828;font-weight:bold}
  small{color:#677}
</style>
</head>
<body>
<div class="card">
<h1>TikTok <span class="accent">authorization</span> callback</h1>
<p id="msg">Reading authorization code…</p>
<div id="code"></div>
<button id="copyBtn" style="display:none" onclick="copyCode()">Copy code</button>
<p><small id="state"></small></p>
<p><small>This page just displays the authorization code returned by TikTok so it can be exchanged for an access token. Nothing is sent anywhere from this page.</small></p>
</div>
<script>
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');
  var error = params.get('error');
  var msg = document.getElementById('msg');
  var codeEl = document.getElementById('code');
  if (error) {
    msg.innerHTML = '<span class="err">Error: ' + error + '</span> ' + (params.get('error_description') || '');
  } else if (code) {
    msg.textContent = 'Authorization code (copy it and paste it back):';
    codeEl.textContent = code;
    document.getElementById('copyBtn').style.display = 'inline-block';
    if (state) document.getElementById('state').textContent = 'state: ' + state;
  } else {
    msg.textContent = 'No authorization code found in the URL.';
  }
  function copyCode(){ navigator.clipboard.writeText(code); document.getElementById('copyBtn').textContent='Copied!'; }
</script>
</body>
</html>
